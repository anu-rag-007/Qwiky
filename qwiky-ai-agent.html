<style>

  }
  #qwiky-window {
    position: fixed;
    bottom: 88px;

    width: 340px;
    max-height: 480px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    display: none;
    flex-direction: column;
    overflow: hidden;

  }

  #qwiky-header {

  }
  #qwiky-header-left { display: flex; align-items: center; gap: 10px; }
  #qwiky-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: white;
  }
  #qwiky-header h3 { font-size: 14px; font-weight: 600; color: white; margin: 0; }
  #qwiky-header p  { font-size: 11px; color: rgba(255,255,255,0.8); margin: 0; }

<!-- Bubble button -->
<button id="qwiky-bubble" onclick="qwikyToggle()" aria-label="Open Qwiky Assistant">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
  <div id="qwiky-notif">1</div>
</button>

<!-- Chat window -->
<div id="qwiky-window">
  <div id="qwiky-header">
    <div id="qwiky-header-left">
      <div id="qwiky-avatar">Q</div>
      <div>
        <h3>Qwiky Assistant</h3>
        <p>Ask me anything about PGs</p>
      </div>
    </div>
    <button id="qwiky-close" onclick="qwikyToggle()">&#x2715;</button>
  </div>
  <div id="qwiky-messages"></div>
  <div id="qwiky-chips"></div>
  <div id="qwiky-input-row">
    <input id="qwiky-input" placeholder="Ask about PGs, pricing, areas..." onkeydown="if(event.key==='Enter') qwikySend()" />
    <button id="qwiky-send" onclick="qwikySend()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function () {

  // =============================================
  // STEP 1: REPLACE WITH YOUR ANTHROPIC API KEY
  // Get one free at https://console.anthropic.com
  // =============================================
  var API_KEY = 'YOUR_API_KEY_HERE';

  var SYSTEM_PROMPT = `You are Qwiky Assistant, a helpful AI on the Qwiky website — an Indian platform for finding PGs (paying guest accommodations) and hostels.

You help users with:
1. Finding PGs/hostels by location and budget — ask for their city and budget if not given
2. Answering questions about PG facilities, what rent usually includes, what to check before moving in
3. Helping PG owners list their property — guide them to click the "+ Post Your Place" button on the site
4. Giving area/locality advice for PG seekers (metro proximity, safety, nearby colleges/offices)

Keep replies short (2-4 sentences), friendly, and practical. Use Indian context — ₹ for prices, refer to Indian cities. Always end with a helpful follow-up question or suggestion to keep the conversation going.`;

  var QUICK_CHIPS = [
    'PGs under ₹5000 in Noida',
    'How to list my PG?',
    'PGs near metro station',
    'What does rent usually include?'
  ];

  var FOLLOWUP_CHIPS = [
    'Search more PGs',
    'Help me list my PG',
    'Tell me about the area',
    'What facilities should I check?'
  ];

  var history = [];
  var isOpen = false;
  var initialized = false;

  window.qwikyToggle = function () {
    isOpen = !isOpen;
    document.getElementById('qwiky-window').classList.toggle('open', isOpen);
    document.getElementById('qwiky-notif').style.display = 'none';
    if (isOpen && !initialized) { initialized = true; qwikyInit(); }
    if (isOpen) setTimeout(function () { document.getElementById('qwiky-input').focus(); }, 120);
  };

  function qwikyInit() {
    addMsg('bot', 'Hi! I\'m your Qwiky Assistant. I can help you find PGs by location & budget, answer your questions, or help you list your property. What are you looking for today?');
    showChips(QUICK_CHIPS);
  }

  function showChips(arr) {
    var c = document.getElementById('qwiky-chips');
    c.innerHTML = arr.map(function (q) {
      return '<button class="qwiky-chip" onclick="qwikyChip(\'' + q.replace(/'/g, "\\'") + '\')">' + q + '</button>';
    }).join('');
  }

  window.qwikyChip = function (text) {
    document.getElementById('qwiky-chips').innerHTML = '';
    addMsg('user', text);
    callAI(text);
  };

  window.qwikySend = function () {
    var inp = document.getElementById('qwiky-input');
    var text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    document.getElementById('qwiky-chips').innerHTML = '';
    addMsg('user', text);
    callAI(text);
  };

  function addMsg(role, text) {
    var m = document.getElementById('qwiky-messages');
    var d = document.createElement('div');
    d.className = 'qwiky-msg ' + role;
    d.textContent = text;
    m.appendChild(d);
    m.scrollTop = m.scrollHeight;
    return d;
  }

  function callAI(userText) {
    history.push({ role: 'user', content: userText });
    var typing = addMsg('bot', '...');
    typing.classList.add('typing');

    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        system: SYSTEM_PROMPT,
        messages: history
      })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var reply = (data.content && data.content[0] && data.content[0].text)
        ? data.content[0].text
        : 'Sorry, I could not get a response right now. Please try again!';
      history.push({ role: 'assistant', content: reply });
      typing.textContent = reply;
      typing.classList.remove('typing');
      document.getElementById('qwiky-messages').scrollTop = 99999;
      showChips(FOLLOWUP_CHIPS);
    })
    .catch(function () {
      typing.textContent = 'Something went wrong. Please try again!';
      typing.classList.remove('typing');
    });
  }

})();
</script>

  IMPORTANT — API KEY SAFETY NOTE

  Putting your API key directly in HTML is fine
  for testing, but for a live public website you
  should use a simple backend proxy so your key
  is never visible to visitors.

  Simple Node.js proxy (free on Render.com):
  
  const express = require('express');
  const fetch = require('node-fetch');
  const app = express();
  app.use(express.json());
  app.use((req, res, next) => {
    res.header('Access-Control-Allow-Origin', '*');
    res.header('Access-Control-Allow-Headers', 'Content-Type');
    next();
  });
  app.post('/chat', async (req, res) => {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': process.env.ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify(req.body)
    });
    const data = await r.json();
    res.json(data);
  });
  app.listen(3000);

  Then change the fetch URL in the script above from:
    'https://api.anthropic.com/v1/messages'
  to:
    'https://your-proxy.onrender.com/chat'
  And remove the 'x-api-key' and
  'anthropic-dangerous-direct-browser-access' headers.
  ============================================
